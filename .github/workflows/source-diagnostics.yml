name: Source diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractor
        run: npm install adm-zip
      - name: Extract source
        run: node unpack-parts.js
      - name: Show receipt storage flow
        run: |
          echo "=== PAYMENT REQUEST SCHEMA ==="
          grep -n -A30 -B5 "payment_requests" server/db/schema.sql
          echo "=== ACCOUNT UPLOAD ROUTES ==="
          grep -n -A80 -B30 "payment-requests" server/routes/account.js
          echo "=== ADMIN RECEIPT ROUTES ==="
          grep -n -A80 -B20 "payment-requests/:id/receipt" server/routes/admin.js
          echo "=== MULTER CONFIG ==="
          grep -Rni "multer\|uploads\|receipt_path\|receipt" server | head -220
