name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== LOAN SERVICE ==="
          sed -n '1,260p' server/services-loans.js || true
          echo "=== LOAN APPLY AND APPROVE ==="
          sed -n '390,470p' server/routes/account.js || true
          sed -n '565,655p' server/routes/admin.js || true
          echo "=== PAYMENT APPROVAL ==="
          grep -n -A130 -B35 "payment-requests/:id/approve" server/routes/admin.js | head -380 || true
          echo "=== CASH CREDIT ==="
          grep -n -A170 -B40 "cash-credit" server/routes/admin.js | head -460 || true
          echo "=== SAVINGS PLAN TARGET ==="
          grep -Rni "duration_months\|plan_type='TARGET'\|plan_type = 'TARGET'" server/routes | head -180 || true