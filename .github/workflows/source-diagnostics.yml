name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== DASHBOARD CARD BUILD ==="
          grep -n -A170 -B30 "function dashboardCards\|function renderDashboard\|function renderApp" www/app.js | head -520 || true
          echo "=== REFRESH TIMERS ==="
          grep -n -A80 -B20 "setInterval\|setTimeout\|refreshAccount\|renderDashboard\|renderApp" www/app.js | head -520 || true
          echo "=== CARD MUTATIONS ==="
          grep -n -A100 -B20 "querySelectorAll.*dashboard\|textContent.*TOTAL SAVINGS\|ACTIVE LOAN\|PAYMENT DUE DATE\|SAVINGS'" www/app.js | head -420 || true