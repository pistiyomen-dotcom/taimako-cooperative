name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== AUTH ROUTES ==="
          grep -n -A80 -B20 "login\|change-password\|change.*password\|must_change_password\|mustChangePassword" server/routes/*.js | head -420 || true
          echo "=== ACCOUNT CREATE ==="
          grep -n -A100 -B30 "create-account\|INSERT INTO accounts\|temporaryPassword\|must_change_password" server/routes/admin.js | head -420 || true
          echo "=== LOGIN UI ==="
          grep -n -A100 -B30 "loginForm\|loginDialog\|mustChange\|changePassword\|change.*PIN\|password" www/app.js | head -500 || true
          echo "=== LOGIN HTML ==="
          grep -n -A80 -B20 "loginDialog\|password\|PIN" www/index.html | head -350 || true