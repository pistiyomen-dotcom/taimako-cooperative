name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== SERVER STARTUP ==="
          sed -n '1,240p' server/index.js || true
          echo "=== SYSTEM MIGRATION PATTERN ==="
          sed -n '45,135p' server/routes/public.js || true