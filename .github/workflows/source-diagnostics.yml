name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          grep -n "loanSubmitBtn" www/index.html www/app.js www/styles.css || true
          grep -n "pointer-events" www/styles.css | head -80 || true
          grep -n "disabled" www/styles.css | head -120 || true