name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== LOAN POST FULL START ==="
          sed -n '340,455p' server/routes/account.js || true
          echo "=== LOAN UI ERROR STYLE ==="
          grep -n -A25 -B10 "form-error\|form-success" www/styles.css | head -180 || true