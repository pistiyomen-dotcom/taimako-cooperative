name: Source diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractor
        run: npm install adm-zip
      - name: Extract source
        run: node unpack-parts.js
      - name: Show admin auth wiring
        run: |
          echo "=== ADMIN ROUTE TOP ==="
          sed -n '1,90p' server/routes/admin.js
          echo "=== SERVER MOUNTS ==="
          sed -n '1,80p' server/index.js
          echo "=== AUTH MIDDLEWARE ==="
          sed -n '1,180p' server/middleware/auth.js 2>/dev/null || true
          echo "=== ADMIN ACCOUNT CREATION ==="
          grep -nE "create.*admin|role.?=.?admin|role.*admin|admin.*account" server/routes/admin.js | head -80 || true
