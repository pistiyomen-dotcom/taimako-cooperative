name: Source diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractor
        run: npm install adm-zip
      - name: Extract source
        run: node unpack-parts.js
      - name: Show create account handlers
        run: |
          grep -n -A55 -B10 "function updateAccountHints" www/app.js
          grep -n -A60 -B10 "createAccountForm.addEventListener" www/app.js
