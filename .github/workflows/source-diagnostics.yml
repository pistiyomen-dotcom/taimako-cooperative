name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== CASH ROUTE END ==="
          sed -n '175,210p' server/routes/admin.js
          echo "=== DASHBOARD REFRESH ==="
          grep -n -A30 -B15 "refreshAccount\|renderApp()" www/app.js | head -180
          echo "=== MEMBER DASHBOARD RENDER ==="
          grep -n -A80 -B20 "dashboardCards\|TOTAL SAVINGS\|REGULAR" www/app.js | head -220
