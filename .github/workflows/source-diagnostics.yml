name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== LOAN SUBMISSION ==="
          grep -n -A180 -B30 "loan-applications" server/routes/account.js | head -520 || true
          echo "=== ADMIN LOAN APPROVAL ==="
          grep -n -A260 -B40 "loan-applications.*approve\|approve.*loan\|self_backed_limit\|guarantor_required\|borrower_savings_at_application" server/routes/admin.js | head -760 || true
          echo "=== LOAN SERVICE SAVINGS ==="
          sed -n '1,280p' server/services-loans.js || true
          echo "=== MEMBER LOAN FORM RULE ==="
          grep -n -A100 -B30 "submitFreshLoanV96\|needsGuarantor\|freshLoanTotalSavings" www/app.js | head -420 || true