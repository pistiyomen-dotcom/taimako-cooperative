name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== CASH CREDIT CSS ==="
          grep -n -A30 -B10 "cash-credit-tabs\|dialog-actions\|#cashCreditFlexibleTab" www/styles.css
          echo "=== CASH CREDIT HTML ==="
          sed -n '168,188p' www/index.html
          echo "=== CONFIRM HANDLER ==="
          sed -n '490,510p' www/app.js
