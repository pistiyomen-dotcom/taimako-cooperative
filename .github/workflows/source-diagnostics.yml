name: Source diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractor
        run: npm install adm-zip
      - name: Extract source
        run: node unpack-parts.js
      - name: Show create account flow
        run: |
          grep -n -A70 -B20 "createAccountDialog\|createAccountForm\|accountRole\|Create Account" www/index.html www/app.js | head -260
