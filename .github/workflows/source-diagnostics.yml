name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - name: Verify Stage 50 output and cache
        run: |
          echo "=== STAGE50 CHAIN ==="
          tail -40 stage36-patch.js
          echo "=== ADMIN SETUP HTML ==="
          grep -n -A18 -B8 "openAdminSetup\|adminSetupDialog" www/index.html
          echo "=== ADMIN SETUP JS ==="
          grep -n -A28 -B8 "openAdminSetup\|adminSetupForm" www/app.js
          echo "=== SERVICE WORKER ==="
          cat www/sw.js 2>/dev/null || cat www/service-worker.js 2>/dev/null || true
