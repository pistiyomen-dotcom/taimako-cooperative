name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== SERVER STARTUP ==="
          sed -n '1,260p' server/index.js || true
          echo "=== DB INIT / MIGRATIONS ==="
          grep -Rni -A100 -B20 "schema.sql\|migration\|setInterval\|cron\|node-cron" server | head -520 || true
          echo "=== ACCOUNT ME ADMIN TOTALS ==="
          grep -n -A110 -B30 "adminFeeTotals" server/routes/account.js || true
          echo "=== ADMIN DASHBOARD CURRENT ==="
          sed -n '325,380p' www/app.js || true