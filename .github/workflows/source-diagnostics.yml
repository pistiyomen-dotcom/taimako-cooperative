name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== RESET DIALOG HTML ==="
          grep -n -A120 -B15 "adminResetDialog" www/index.html || true
          echo "=== RESET LOGIC ==="
          grep -n -A260 -B20 "openAdminResetV111\|confirmResetCredentialAccountV111\|confirmDeleteAccountV111" www/app.js | head -620 || true
          echo "=== BUTTON CSS ==="
          grep -n -A60 -B20 "\.secondary\|button\.secondary\|\.danger\|dialog-card button" www/styles.css | head -320 || true