name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== CREATE UI LOGIC ==="
          grep -n -A95 -B15 "function setCreateAccountType" www/app.js
          grep -n -A80 -B15 "createAccountForm.addEventListener" www/app.js
          echo "=== CLOSE ==="
          grep -n -A20 -B10 "querySelectorAll.*data-close" www/app.js
          echo "=== ACCOUNT CREATE ENDPOINT ==="
          grep -n -A95 -B15 "router.post('/accounts'" server/routes/admin.js
