name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== ALL LOAN APPROVAL ROUTES ==="
          grep -n -A140 -B40 "loan-applications.*approve\|loan.*approve\|loan_disbursement" server/routes/admin.js | head -700 || true
          echo "=== FRONTEND LOAN APPROVAL CALLS ==="
          grep -n -A100 -B30 "loan-applications\|APPROVE LOAN\|approveLoan\|loan approval" www/app.js | head -520 || true
          echo "=== LOANS TABLE SCHEMA ==="
          grep -n -A80 -B20 "CREATE TABLE IF NOT EXISTS loans" server/db/schema.sql | head -220 || true