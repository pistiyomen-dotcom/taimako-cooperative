name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "ACCOUNT"
          sed -n '25,90p' server/routes/account.js || true
          echo "DASHBOARD"
          sed -n '300,370p' www/app.js || true
          echo "STABILIZER"
          grep -n -A100 -B10 "stabilizeMemberDashboardV100" www/app.js || true