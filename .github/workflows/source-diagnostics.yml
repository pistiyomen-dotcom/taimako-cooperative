name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== CASH FORM OUTPUT ==="
          sed -n '168,188p' www/index.html
          echo "=== CASH CONFIRM OUTPUT ==="
          sed -n '490,520p' www/app.js
          echo "=== CACHE ==="
          cat www/sw.js
