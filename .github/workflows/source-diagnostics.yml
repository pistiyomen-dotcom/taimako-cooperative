name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          sed -n '1,120p' www/app.js