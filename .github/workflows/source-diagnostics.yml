name: Source diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractor
        run: npm install adm-zip
      - name: Extract source
        run: node unpack-parts.js
      - name: Exact linked-account transfer source
        run: |
          grep -n -A110 -B20 "router.post('/flexible-transfer'" server/routes/account.js
          grep -n -A70 -B15 "router.get('/linked-regular'" server/routes/account.js
          grep -n -A70 -B20 "router.post('/account-links'" server/routes/admin.js
          grep -n -A20 -B5 "CREATE TABLE IF NOT EXISTS account_links" server/db/schema.sql
          sed -n '604,635p' www/app.js
          grep -n -A30 -B10 'id="transferDialog"' www/index.html
