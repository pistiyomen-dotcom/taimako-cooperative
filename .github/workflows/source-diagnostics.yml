name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== CASH HANDLERS ==="
          sed -n '485,520p' www/app.js
          sed -n '1105,1135p' www/app.js
          echo "=== SYNTAX CHECK ==="
          node --check www/app.js
