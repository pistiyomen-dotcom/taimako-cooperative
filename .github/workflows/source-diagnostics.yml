name: Member Search source inspection
on:
  push:
    branches: [fix/member-search-only]
    paths: ['.github/workflows/source-diagnostics.yml', 'member-search-source-inspection.js']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node unpack-parts.js
      - name: Inspect only relevant app routes
        run: node member-search-source-inspection.js
