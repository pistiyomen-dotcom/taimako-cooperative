name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== EVENT BINDINGS BEFORE CASH ==="
          sed -n '1,490p' www/app.js | grep -n "addEventListener"
          echo "=== REMOVED CREATE TAB REFERENCES ==="
          grep -n "createRegularTab\|createFlexibleTab" www/app.js www/index.html || true
          echo "=== TOP-LEVEL GETELEMENT IDS ==="
          sed -n '1,490p' www/app.js | grep -n "getElementById"
