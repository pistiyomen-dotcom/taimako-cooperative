name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== STATIC SERVER ==="
          grep -n -A20 -B15 "express.static\|www" server/index.js
          echo "=== SCRIPT REFERENCES ==="
          grep -n "app.js\|sw.js" www/index.html www/app.js
          echo "=== CACHE OUTPUT ==="
          head -40 www/sw.js
