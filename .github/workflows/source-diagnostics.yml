name: Source diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractor
        run: npm install adm-zip
      - name: Extract source
        run: node unpack-parts.js
      - name: Show admin permission integration points
        run: |
          echo "=== ADMIN MIDDLEWARE ==="
          cat server/middleware/admin.js
          echo "=== AUTH LOGIN PAYLOAD ==="
          grep -nE "jwt\.sign|token|role" server/routes/auth.js | head -120
          echo "=== ADMIN DASHBOARD ACTIONS ==="
          grep -nE "SAVINGS PLAN SETUP|MONTH-END COMPLIANCE|COMPLIANCE SETTLEMENT|WELFARE PAYOUT|CONSTANT MATURITY|CREATE" www/app.js | head -160
