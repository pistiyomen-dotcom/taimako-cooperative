name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== CONFIG JS ==="
          cat www/config.js || true
          echo "=== API BASE USAGE ==="
          grep -n -A12 -B8 "API_BASE" www/app.js www/config.js | head -120 || true
          echo "=== SERVICE WORKER CACHE ==="
          head -80 www/sw.js || true
          echo "=== HTML VERSION TAGS ==="
          grep -n "app.js?v\|dashboard-refresh.js?v\|cash-credit-v66.js?v" www/index.html || true