name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== ACCOUNT ME ROUTE ==="
          grep -n -A120 -B40 "router.get('/me'\|router.get(\"/me\"\|/api/account/me" server/routes/account.js www/app.js | head -520 || true
          echo "=== LOAN SERVICE IMPORTS ==="
          grep -n -A20 -B20 "services-loans\|accrueOverdueForAccount\|syncActiveLoanForAccount" server/routes/account.js server/routes/auth.js server/routes/admin.js | head -420 || true
          echo "=== REFRESH ACCOUNT UI ==="
          grep -n -A80 -B30 "async function refreshAccount\|refreshAccount =" www/app.js | head -320 || true