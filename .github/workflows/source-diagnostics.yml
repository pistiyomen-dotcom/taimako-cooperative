name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== ADMIN LOAN LIST APPROVE DECLINE ==="
          grep -n -A260 -B20 "router.get('/loan-applications" server/routes/admin.js | head -560 || true
          echo "=== ADMIN LOAN APPROVE ==="
          grep -n -A220 -B20 "loan-applications/:id/approve" server/routes/admin.js | head -500 || true
          echo "=== ADMIN LOAN DECLINE ==="
          grep -n -A120 -B20 "loan-applications/:id/reject\|loan-applications/:id/decline" server/routes/admin.js | head -320 || true