name: Source diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractor
        run: npm install adm-zip
      - name: Extract source
        run: node unpack-parts.js
      - name: Show account link and flexible transfer flow
        run: |
          grep -n -A100 -B30 "flexible-transfer\|linked-regular\|account-links\|flexible" server/routes/account.js server/routes/admin.js | head -320
          grep -n -A90 -B30 "TRANSFER\|linkedRegularInfo\|openTransferDialog" www/app.js www/index.html | head -300
