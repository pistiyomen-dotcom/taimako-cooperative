name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== LOAN SERVICE ==="
          sed -n '1,320p' server/services-loans.js || true
          echo "=== LOAN APPROVAL ==="
          grep -n -A120 -B30 "loan.*approve\|approved_principal\|base_interest\|due_date\|last_accrual_date" server/routes/admin.js | head -520 || true
          echo "=== MEMBER LOAN DASHBOARD ==="
          grep -n -A80 -B30 "LOAN INTEREST\|PAYMENT DUE DATE\|ACTIVE LOAN\|loanInterest\|loanDueDate" www/app.js server/routes/account.js | head -420 || true