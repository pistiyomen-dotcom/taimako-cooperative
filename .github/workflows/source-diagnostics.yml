name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          grep -n -A22 -B4 "Create Account" www/index.html
          grep -n -A45 -B5 "function updateAccountHints" www/app.js
          grep -n -A28 -B5 "linkedRegularUsername" server/routes/admin.js
