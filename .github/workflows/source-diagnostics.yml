name: Source diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractor
        run: npm install adm-zip
      - name: Extract source
        run: node unpack-parts.js
      - name: Show cash credit flow
        run: |
          sed -n '145,170p' www/index.html
          sed -n '385,438p' www/app.js
