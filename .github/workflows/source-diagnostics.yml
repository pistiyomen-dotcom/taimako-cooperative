name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== DASHBOARD JS ==="
          grep -n -A180 -B25 "function renderDashboard" www/app.js | head -420 || true
          echo "=== API HELPER ==="
          grep -n -A100 -B15 "async function api\|function api(" www/app.js | head -260 || true
          echo "=== AUTH / ACCOUNT ROUTES ==="
          grep -R -n "requireAuth\|router.get('/me'\|router.get('/dashboard'\|module.exports = router\|created_by_account_id\|writeAdminAudit" server | head -500 || true
          echo "=== ADMIN TILE REFERENCES ==="
          grep -n -A120 -B20 "\['ADMIN'\|\['BALANCES'\|admin-action-card" www/app.js | head -320 || true
          echo "=== RESET HTML ==="
          grep -n -A80 -B10 "adminResetDialog\|resetCredentialConfirm\|deleteAccountConfirm" www/index.html | head -220 || true
