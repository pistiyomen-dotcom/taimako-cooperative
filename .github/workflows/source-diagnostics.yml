name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== ALL CASH TAB IDS ==="
          grep -Rni "cashCreditRegularTab\|cashCreditFlexibleTab" www
          echo "=== ALL MEMBER CONFIRM REFERENCES ==="
          grep -Rni "confirmCreditMember\|creditMemberConfirm" www
          echo "=== SECONDARY/PRIMARY/DIALOG CSS ==="
          grep -n "secondary\|primary\|dialog-actions\|cash-credit-tabs" www/styles.css
