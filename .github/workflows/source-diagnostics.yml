name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== AUTH MIDDLEWARE ==="
          cat server/middleware/auth.js
          echo "=== ADMIN MIDDLEWARE ==="
          cat server/middleware/admin.js
          echo "=== ACCOUNT ROUTES INSERTS ==="
          grep -n -A8 -B6 "created_by_account_id\|req.auth.sub\|module.exports" server/routes/account.js | head -1200 || true
          echo "=== FRONTEND ADMIN TILE / ACTION ==="
          grep -n -A60 -B15 "function dashboardCards\|function adminAction\|function api(path" www/app.js | head -600 || true
          echo "=== HTML DIALOG MARKERS ==="
          grep -n -A20 -B5 "</body>\|adminPermissionsDialog\|memberSearchDialog" www/index.html | tail -300 || true
