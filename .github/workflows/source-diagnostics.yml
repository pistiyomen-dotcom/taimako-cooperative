name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== MEMBER LOAN ACTION ==="
          grep -n -A12 -B12 "APPLY FOR LOAN\|loanApplyDialog\|openLoanApplyDialog" www/index.html www/app.js | head -320 || true
          echo "=== LOAN DOM REFERENCES ==="
          grep -n "loanApply" www/app.js | head -120 || true