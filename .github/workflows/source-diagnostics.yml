name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== ADMIN ROUTE TOP ==="
          sed -n '1,90p' server/routes/admin.js || true
          echo "=== ADMIN ACTION ==="
          grep -n -A120 -B10 "function adminAction" www/app.js | head -260 || true
          echo "=== DIALOG AREA ==="
          grep -n -A120 -B20 "summaryReportDialog\|adminPermissionsDialog" www/index.html | head -320 || true
          echo "=== SCHEMA END ==="
          tail -120 server/db/schema.sql || true