name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== LOAN FORM HTML ==="
          grep -n -A120 -B30 "id=\"loanApplyForm\"\|id=\"loanProduct\"\|id=\"loanAmount\"\|loanApplyDialog" www/index.html | head -420 || true
          echo "=== LOAN SUBMIT JS ==="
          grep -n -A80 -B30 "loanApplyForm.addEventListener" www/app.js | head -220 || true
          echo "=== ACCOUNT LOAN POST ROUTE ==="
          grep -n -A220 -B30 "router.post('/loan-applications'" server/routes/account.js | head -520 || true