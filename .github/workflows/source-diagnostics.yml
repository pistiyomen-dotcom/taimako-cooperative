name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== CREATE ACCOUNT HTML ==="
          grep -n -A55 -B10 "createAccountDialog" www/index.html
          echo "=== CREATE ACCOUNT JS ==="
          grep -n -A110 -B20 "createAccountForm\|setCreateAccountType\|newRole" www/app.js
          echo "=== CLOSE HANDLERS ==="
          grep -n -A30 -B10 "data-close" www/app.js
          echo "=== ADMIN CREATE ROUTE ==="
          grep -n -A120 -B20 "accounts" server/routes/admin.js
