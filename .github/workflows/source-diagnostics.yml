name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== MEMBER LOAN ROUTE EXACT ==="
          sed -n '430,570p' server/routes/account.js || true
          echo "=== ADMIN LOAN LIST EXACT ==="
          sed -n '550,640p' server/routes/admin.js || true
          echo "=== LOAN APPLICATION SCHEMA ==="
          sed -n '100,150p' server/db/schema.sql || true