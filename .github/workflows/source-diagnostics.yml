name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - name: Inspect public route and login UI
        run: |
          sed -n '1,220p' server/routes/public.js
          echo "=== LOGIN HTML ==="
          grep -n -A45 -B10 'id="loginDialog"' www/index.html
          echo "=== PUBLIC ACTION HANDLER ==="
          grep -n -A70 -B20 "dataset.publicAction" www/app.js
