name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          grep -n -A240 -B50 "router.post('/loan-applications/:id/approve'\|approvedAmount\|guarantorRequired = Number" server/routes/admin.js | head -700 || true