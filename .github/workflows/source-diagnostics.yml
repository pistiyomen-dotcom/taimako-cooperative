name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== ALL TIMERS ==="
          grep -n "setInterval\|setTimeout" www/app.js || true
          echo "=== ALL OBSERVERS ==="
          grep -n -A30 -B10 "MutationObserver\|observe(" www/app.js || true
          echo "=== ALL RENDER CALLS ==="
          grep -n "renderDashboard()\|renderApp()\|refreshAccount()" www/app.js || true
          echo "=== ALL DASHBOARD CARD TEXT MUTATIONS ==="
          grep -n "dashboard-card\|dashboard-grid\|dashboardContent" www/app.js || true
          echo "=== EXTRA SCRIPTS ==="
          tail -80 www/index.html || true