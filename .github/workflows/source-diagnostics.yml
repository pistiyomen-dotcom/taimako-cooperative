name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== ACCOUNT ME ROUTE ==="
          grep -n -A180 -B20 "router.get('/me" server/routes/account.js | head -360 || true
          echo "=== BALANCE SERIALIZATION ==="
          grep -Rni -A80 -B20 "totalSavings\|numberOfShares\|loanPrincipal\|loanInterest" server | head -520 || true
          echo "=== DASHBOARD TOTAL SAVINGS ==="
          grep -n -A80 -B20 "TOTAL SAVINGS\|freshLoanTotalSavingsV94" www/app.js | head -260 || true