name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          sed -n '1,260p' www/cash-credit-v66.js || true
          sed -n '177,300p' server/routes/admin.js || true
          grep -n -A80 -B20 "APPLICATION FORM" server/routes/admin.js www/cash-credit-v66.js || true