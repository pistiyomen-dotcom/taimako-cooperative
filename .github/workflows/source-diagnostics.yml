name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== LOAN FORM CONTEXT ==="
          sed -n '235,315p' www/index.html || true
          echo "=== DIALOG / FORM CSS ==="
          grep -n -A12 -B8 "dialog\|loanApply\|loanSubmitBtn\|form-actions\|modal" www/styles.css | head -320 || true
          echo "=== BUTTON RULES ==="
          grep -n -A8 -B8 "button\|\.primary" www/styles.css | head -260 || true
          echo "=== LOAN DIALOG JS ==="
          sed -n '770,875p' www/app.js || true