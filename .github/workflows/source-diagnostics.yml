name: Source diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractor
        run: npm install adm-zip
      - name: Extract source
        run: node unpack-parts.js
      - name: Exact withdrawal transaction flow
        run: |
          sed -n '360,450p' server/routes/admin.js
          echo "=== MEMBER WITHDRAW REQUEST ==="
          sed -n '185,260p' server/routes/account.js
