name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== MEMBER APPLY LOAN FORM ==="
          grep -n -A140 -B40 "loanApplyForm\|APPLY FOR LOAN\|loan-applications" www/app.js www/index.html | head -700 || true
          echo "=== MEMBER LOAN SUBMIT ROUTE ==="
          grep -n -A180 -B40 "router.post('/loan-applications'\|INSERT INTO loan_applications" server/routes/account.js | head -700 || true
          echo "=== ADMIN PENDING LOANS ==="
          grep -n -A140 -B40 "loadPendingLoans\|loan-applications?status=pending" www/app.js server/routes/admin.js | head -700 || true