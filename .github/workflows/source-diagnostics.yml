name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== LOANS SCHEMA ==="
          grep -n -A90 -B15 "CREATE TABLE IF NOT EXISTS loans" server/db/schema.sql || true
          echo "=== LOAN APPLICATION SCHEMA ==="
          grep -n -A70 -B10 "CREATE TABLE IF NOT EXISTS loan_applications" server/db/schema.sql || true