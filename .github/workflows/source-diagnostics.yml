name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== STAGE106 SERVER HOOK ==="
          grep -n -A70 -B20 "MANAGEMENT_MONTH_END_SCHEDULER\|processManagementMonthEnd\|app.listen" server/index.js || true
          echo "=== STAGE106 SERVICE ==="
          sed -n '1,260p' server/services-management.js || true
          echo "=== STAGE106 ADMIN CARDS ==="
          grep -n -A28 -B8 "MANAGEMENT BALANCE\|APPLICATION FORM" www/app.js | head -220 || true