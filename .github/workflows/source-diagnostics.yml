name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== DB INIT / MIGRATION PATTERNS ==="
          sed -n '1,220p' server/db/index.js 2>/dev/null || true
          sed -n '1,260p' server/db/init.js 2>/dev/null || true
          echo "=== LOAN RELATED STARTUP / META TABLES ==="
          grep -Rni "app_meta\|migration\|schema_migrations\|loan_principal\|loan_due_date" server | head -320 || true