name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== ACCOUNTS TABLE ==="
          grep -n -A55 -B5 "CREATE TABLE IF NOT EXISTS accounts" server/db/schema.sql || true
          echo "=== FKS TO ACCOUNTS ==="
          grep -n "REFERENCES accounts" server/db/schema.sql || true
          echo "=== AUTH LOGIN CHANGE ==="
          grep -n -A130 -B20 "router.post('/login'\|router.post('/change-password'" server/routes/auth.js || true
          echo "=== ADMIN ACCOUNT LOOKUP ==="
          grep -n -A100 -B20 "router.get('/accounts\|router.post('/accounts" server/routes/admin.js | head -420 || true