name: Source diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractor
        run: npm install adm-zip
      - name: Extract source
        run: node unpack-parts.js
      - name: Show regular withdrawal and year-end logic
        run: |
          grep -n -A120 -B40 "REGULAR" server/routes/account.js server/routes/admin.js | grep -E "withdraw|October|November|REGULAR|regular" | head -260
          grep -n -A100 -B30 "withdrawal" server/routes/account.js | head -260
          grep -n -A80 -B20 "withdrawal-requests/:id/approve" server/routes/admin.js | head -220
