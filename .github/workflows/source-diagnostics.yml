name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== CASH CREDIT ROUTE ==="
          grep -n -A140 -B20 "cash-credit" server/routes/admin.js
          echo "=== BALANCE HELPERS ==="
          grep -Rni -A80 -B20 "member_balances\|credit.*balance\|UPDATE member_balances" server | head -260
          echo "=== DASHBOARD ME ==="
          grep -n -A120 -B20 "router.get('/me'\|/api/account/me" server/routes/account.js
