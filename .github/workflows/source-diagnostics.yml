name: Source diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractor
        run: npm install adm-zip
      - name: Extract source
        run: node unpack-parts.js
      - name: Show payment dialog details
        run: |
          sed -n '172,215p' www/index.html
          grep -n "account-number\|accountNumber\|BANK DETAILS\|Bank Details\|ACCOUNT DETAILS\|Account Details" www/app.js www/index.html || true
