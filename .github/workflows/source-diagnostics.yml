name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== PENDING APPROVAL FUNCTION ==="
          grep -n -A180 -B40 "function loadPendingApprovals\|loadPendingApprovals =" www/app.js | head -500 || true
          echo "=== APPROVAL DIALOG HTML ==="
          grep -n -A120 -B30 "approvalsDialog\|approvalsList" www/index.html | head -350 || true