name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
      - 'stage240-patch.js'
      - 'stage239-admin-check-assisted-account.js'
      - 'stage242-requisition.js'
      - 'stage243-requisition-approval.js'
  pull_request:
    paths:
      - '.github/workflows/source-diagnostics.yml'
      - 'stage242-requisition.js'
      - 'stage243-requisition-approval.js'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          node --check www/app.js
          node --check server/middleware/auth.js
          node --check server/routes/account.js
          node --check server/routes/admin.js
          node --check stage240-patch.js
          node --check stage242-requisition.js
          node --check stage243-requisition-approval.js
          node --check www/requisition-v242.js
          node --check www/requisition-approval-v243.js
          node -e "const fs=require('fs'); const s=fs.readFileSync('stage240-patch.js','utf8'); if(!s.includes('TMCS_COOPERATIVE_LEDGER_V240') || !s.includes('currentMonthInterest')) process.exit(1); console.log('Stage 240 accounting markers verified.')"
          echo "=== REQUISITION ROUTES AND FINANCIAL COLUMNS ==="
          grep -n -i -E -A30 -B12 "requisition-requests-v242|management_balance|tmcs_cooperative_ledger|available_balance" server/routes/account.js server/routes/admin.js | head -1000
          grep -q "cash_requisition_requests" server/db/schema.sql
          grep -q "management_balance" server/db/schema.sql
          grep -q "available_balance" server/db/schema.sql
          grep -q "REQUISITION APPROVAL & SUMMARY" www/app.js
          grep -q "openRequisitionApprovalV243" www/app.js
          grep -q "requisition-approval-v243.js" www/index.html
          grep -q "requisition-approval-v243.js" www/sw.js
          ! grep -q "requisitionRequests" <(sed -n '/async function loadPendingApprovals()/,/async function viewReceipt(id)/p' www/app.js)
          echo "Requisition syntax, dedicated approval UI, and balance-column markers verified."
