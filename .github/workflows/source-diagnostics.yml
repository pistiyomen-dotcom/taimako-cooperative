name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== REFRESH CALL 760-890 ==="
          sed -n '760,890p' www/app.js || true
          echo "=== MONTH LABEL OBSERVER ==="
          sed -n '1248,1272p' www/app.js || true
          echo "=== ACTIVE LOAN REFERENCES ==="
          grep -n -A20 -B20 "ACTIVE LOAN\|loanDueDate\|loanPrincipal" www/app.js || true