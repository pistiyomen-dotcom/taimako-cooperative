name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== DASHBOARD CARD CSS ==="
          grep -n -A35 -B15 "dashboard-card" www/styles.css | head -220 || true
          echo "=== VALUE TEXT CSS ==="
          grep -n -A20 -B10 "dashboard-grid.*p\|dashboard-card p\|opacity\|overflow" www/styles.css | head -280 || true