name: Source diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractor
        run: npm install adm-zip
      - name: Extract source
        run: node unpack-parts.js
      - name: Inspect loan source and plan linkage
        run: |
          grep -n -A140 -B30 "loan-applications" server/routes/account.js server/routes/admin.js | head -420
          echo "=== LOAN SCHEMA ==="
          grep -n -A80 -B10 "CREATE TABLE IF NOT EXISTS loan" server/db/schema.sql | head -220
          echo "=== LOAN UI ==="
          grep -n -A80 -B20 "loanApply" www/index.html www/app.js | head -260
