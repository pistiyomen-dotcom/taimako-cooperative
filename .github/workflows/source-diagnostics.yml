name: Source diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractor
        run: npm install adm-zip
      - name: Extract source
        run: node unpack-parts.js
      - name: Show dashboard rendering
        run: |
          grep -n -A45 -B25 "function renderAdmin" www/app.js || true
          grep -n -A50 -B20 "CREATE ACCOUNT" www/app.js | head -180
