name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== ADMIN DASHBOARD ==="
          sed -n '267,345p' www/app.js || true
          echo "=== ADMIN ACTION ==="
          grep -n -A120 -B10 "function adminAction" www/app.js | head -260 || true
          echo "=== SCHEMA HEAD ==="
          sed -n '1,260p' server/db/schema.sql || true
          echo "=== ACCOUNT ME ==="
          sed -n '20,65p' server/routes/account.js || true