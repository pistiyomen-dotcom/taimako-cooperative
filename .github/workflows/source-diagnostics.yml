name: Source diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractor
        run: npm install adm-zip
      - name: Extract source
        run: node unpack-parts.js
      - name: Exact loan schema and approval
        run: |
          grep -n -A70 -B5 "CREATE TABLE IF NOT EXISTS loan_applications" server/db/schema.sql
          grep -n -A70 -B5 "CREATE TABLE IF NOT EXISTS loans" server/db/schema.sql
          sed -n '391,470p' server/routes/account.js
          sed -n '500,590p' server/routes/admin.js
          grep -n -A35 -B10 'id="loanApplyDialog"' www/index.html
