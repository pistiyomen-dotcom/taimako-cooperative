name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== DIVIDEND / BALANCE SCHEMA ==="
          grep -Rni -A80 -B20 "dividend\|loan_interest\|cooperative_financials\|management_fee_transfers" server/db server | head -700 || true
          echo "=== TRANSACTIONS SCHEMA ==="
          grep -n -A80 -B20 "CREATE TABLE IF NOT EXISTS transactions" server/db/schema.sql || true
          echo "=== MEMBER DASHBOARD DIVIDEND ==="
          grep -n -A80 -B20 "DIVIDEND" www/app.js | head -260 || true
          echo "=== CASH INTEREST TRANSACTIONS ==="
          grep -Rni -A100 -B30 "destination.*INTEREST\|loan_interest" server/routes/admin.js server/routes/account.js | head -520 || true
          echo "=== MANAGEMENT SERVICE ==="
          cat server/services-management.js || true