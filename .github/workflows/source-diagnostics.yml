name: Source diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractor
        run: npm install adm-zip
      - name: Extract source
        run: node unpack-parts.js
      - name: Exact approval interest block
        run: |
          sed -n '545,625p' server/routes/admin.js
          echo "=== MEMBER LOAN FORM ==="
          sed -n '277,289p' www/index.html
