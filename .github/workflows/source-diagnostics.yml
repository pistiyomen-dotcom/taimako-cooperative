name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== SETTINGS UI ==="
          grep -n -A120 -B20 "openAdminSettingsV101\|saveAdminSettings\|minimumShareSetting\|registrationFeeSetting" www/app.js www/index.html | head -360 || true
          echo "=== SETTINGS API ==="
          grep -n -A120 -B20 "router.get('/settings'\|router.put('/settings'" server/routes/admin.js | head -320 || true
          echo "=== SETTINGS SCHEMA ==="
          grep -n -A40 -B10 "cooperative_settings" server/db/schema.sql || true