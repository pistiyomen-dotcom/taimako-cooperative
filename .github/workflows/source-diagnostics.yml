name: Source diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractor
        run: npm install adm-zip
      - name: Extract source
        run: node unpack-parts.js
      - name: Show regular withdrawal and year-end logic
        run: |
          grep -n -A120 -B30 "withdrawal" server/routes/account.js | head -320
          echo "=== ADMIN APPROVAL ==="
          grep -n -A120 -B20 "withdrawal-requests/:id/approve" server/routes/admin.js | head -280
          echo "=== REGULAR RULE TEXT ==="
          grep -n -A40 -B20 "Regular Savings\|REGULAR" www/app.js | head -220
