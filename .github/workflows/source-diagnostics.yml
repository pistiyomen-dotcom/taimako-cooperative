name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          grep -n -A55 -B8 "function updateLoanGuarantorV94" www/app.js || true
          grep -n -A8 -B4 "loanAmountV94.*addEventListener" www/app.js || true
          grep -n -A18 -B6 "id=\"loanGuarantorV94\"" www/index.html || true