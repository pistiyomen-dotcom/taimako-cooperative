name: Source diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - name: Show reconstructed schema
        run: |
          nl -ba server/db/schema.sql | sed -n '95,165p'
          nl -ba server/db/schema.sql | sed -n '1,95p'
