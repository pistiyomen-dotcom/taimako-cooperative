name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== ADMIN DASHBOARD CARDS ==="
          sed -n '290,345p' www/app.js || true
          echo "=== CASH CREDIT ROUTES ==="
          grep -n -A220 -B20 "cash-credit" server/routes/admin.js | head -520 || true
          echo "=== CASH CREDIT V66 ==="
          sed -n '1,320p' www/cash-credit-v66.js || true
          echo "=== SUMMARY / ADMIN TOTALS ==="
          grep -n -A180 -B20 "summary-report\|SUMMARY REPORT\|membership_card\|flexible_card\|application_form" server/routes/admin.js www/app.js | head -520 || true