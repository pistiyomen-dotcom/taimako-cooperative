name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== PAYMENT APPROVAL EXACT ==="
          grep -n "router.post('/payment-requests/:id/approve" server/routes/admin.js || true
          sed -n '260,380p' server/routes/admin.js || true
          echo "=== CASH CREDIT EXACT ==="
          grep -n "cash-credit" server/routes/admin.js || true
          sed -n '1060,1165p' server/routes/admin.js || true
          echo "=== LOAN APPROVE EXACT ==="
          sed -n '575,640p' server/routes/admin.js || true