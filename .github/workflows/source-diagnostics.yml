name: Source diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extractor
        run: npm install adm-zip
      - name: Extract source
        run: node unpack-parts.js
      - name: Show finance details
        run: |
          echo "=== TRANSACTIONS TABLE ==="
          sed -n '30,55p' server/db/schema.sql
          echo "=== ACCOUNT HISTORY ROUTE ==="
          sed -n '45,85p' server/routes/account.js
          echo "=== ADMIN CREDIT INSERTS ==="
          sed -n '130,165p' server/routes/admin.js
          sed -n '210,245p' server/routes/admin.js
          sed -n '375,405p' server/routes/admin.js
          echo "=== ACCOUNT INSERTS ==="
          sed -n '315,345p' server/routes/account.js
