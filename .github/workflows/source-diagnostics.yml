name: Source diagnostics
on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install adm-zip
      - run: node unpack-parts.js
      - run: |
          echo "=== LOAN FORM HTML ==="
          grep -n -A90 -B20 "loanGuarantorV94\|loanAmountV94\|loanGuarantorLabelV94" www/index.html | head -260 || true
          echo "=== LOAN FORM LOGIC ==="
          grep -n -A170 -B30 "updateLoanGuarantorV94\|openLoanApplyV94\|loanAmountV94" www/app.js | head -420 || true