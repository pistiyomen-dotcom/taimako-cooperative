name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bundle.part*'
      - 'unpack-parts.js'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install bootstrap dependency
        run: npm install

      - name: Extract TAIMAKO source
        run: node unpack-parts.js

      - name: Install application dependencies
        run: npm install

      - name: Configure live TAIMAKO API
        run: node scripts/set-android-api.js https://taimako-cooperative.onrender.com

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taimako-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

