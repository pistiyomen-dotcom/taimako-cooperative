name: Verify Member Search Removal
on:
  push:
    branches: [main]
    paths:
      - 'stage205-remove-member-search.js'
      - 'stage51-patch.js'
      - '.github/workflows/verify-member-search-removal.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node unpack-parts.js
      - run: node --check www/app.js
      - run: node --check server/routes/admin.js
      - run: node --check server/routes/account.js
      - name: Confirm deleted features
        run: |
          node - <<'NODE'
          const fs=require('fs'),a=fs.readFileSync('www/app.js','utf8'),h=fs.readFileSync('www/index.html','utf8'),r=fs.readFileSync('server/routes/admin.js','utf8');
          if(a.includes("['MEMBER SEARCH'") || a.includes('memberLookupFresh') || h.includes('memberLookupFreshDialog') || r.includes("router.get('/members/search'"))throw Error('Member Search still exists');
          console.log('PASS: Member Search tile, fresh dialog and dedicated API removed');
          NODE

      - name: Inspect public welcome markup
        run: |
          grep -in -C 7 -E 'welcome to|financial independence|cooperative movement' www/index.html www/app.js www/styles.css | head -115 || true

      - name: Inspect scoped informational elements
        run: |
          grep -in -C 4 -E 'One secure system|Built for both mobile|Stage 10 development|connectionStatus|Shared server connected|function renderApp|dashboardContent.append' www/index.html www/app.js | tail -115 || true

      - name: Verify current welcome message typography
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('www/index.html','utf8');
          for(const value of ['>Welcome</span>','>to</span>','>TMCS LTD</span>','>a cooperative movement</span>','>for achieving</span>','>financial independence</span>',"font-family:'Aclonica'","font-family:'Kingthings Petrock'","clamp(1.9rem,7.3vw,3.35rem)"]){if(!html.includes(value))throw Error('Welcome typography missing: '+value);}
          console.log('PASS: Enlarged six-line welcome message and both font families present.');
          NODE

      - name: Inspect create-account success handler
        run: |
          grep -n -A65 -B12 -E "createAccountForm.addEventListener|createAccountSuccess.textContent|createAccountForm.reset" www/app.js | tail -180 || true

      - name: Inspect username reminder runtime
        run: |
          node - <<'NODE'
          const fs=require('fs');const a=fs.readFileSync('www/app.js','utf8');
          for(const term of ["function updateAccountHints()", "tmcsRestoreCreatedUsernameV213", "createAccountForm.addEventListener('submit'", "newRole.addEventListener('change'"]){const i=a.indexOf(term);console.log('SNAPSHOT',term,'at',i, a.slice(Math.max(0,i-150),i+1500));}
          NODE

      - name: Diagnose Flexible withdrawal routes and UI
        run: |
          grep -in -C 9 -E 'flexible.*withdraw|withdraw.*flexible|withdrawalForm|withdrawalRequest' www/app.js server/routes/*.js | head -330 || true

      - name: Inspect withdrawal submission and account route
        run: |
          node - <<'NODE'
          const fs=require('fs');for(const [p,start,end] of [['www/app.js',"withdrawalForm.addEventListener('submit'","function openTransferDialog"],['server/routes/account.js',"router.post('/withdrawal-requests'","router.get('/withdrawal-requests'"]]){const a=fs.readFileSync(p,'utf8');let i=a.indexOf(start),j=a.indexOf(end,i+start.length);console.log('SECTION',p,a.slice(i,j>i?j:i+9000));}
          NODE

      - name: Diagnose withdrawal form HTML and submit interception
        run: |
          node - <<'NODE'
          const fs=require('fs');for(const p of ['www/index.html','www/app.js']){const a=fs.readFileSync(p,'utf8');for(const term of ['id="withdrawalForm"','id="withdrawalDialog"',"withdrawalForm.addEventListener('submit'","document.addEventListener('submit'"]){let i=a.indexOf(term);console.log('FIND',p,term,i,a.slice(Math.max(0,i-450),i+1800));}}
          NODE
