name: Assisted Access Development Checks
on:
  push:
    branches: [feature/member-assisted-access]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse development JavaScript
        run: |
          node --check assisted-access/session-service.js
          node --check assisted-access/router.js
          node --check assisted-access/context-middleware.js
          node --check assisted-access/member-view.js
          node --check assisted-access/stage210-dev-integration.js
      - name: Run development unit tests
        run: |
          node tests/member-assistance-guard.test.js
          node tests/member-assistance-session.test.js
          node tests/member-assistance-ui.test.js
